name: Refresh backup homepage report
on:
  repository_dispatch:
    types: [backup_completed]
permissions:
  contents: write
concurrency:
  group: homepage-backup-report
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and save backup summary
        env:
          BACKUP_REPORT: ${{ toJSON(github.event.client_payload) }}
        run: |
          python3 scripts/receive_backup_report.py
      - name: Commit only when updated
        run: |
          if git diff --quiet -- public/backup-latest.json; then
            echo "No update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/backup-latest.json
          git commit -m "chore: refresh latest backup metrics"
          git push
