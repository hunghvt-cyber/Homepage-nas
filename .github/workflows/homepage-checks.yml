name: Homepage checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build.py
      - run: npm test
      - run: node --check public/guides.js && node --check api/notes.js && node --check lib/validation.js
      - run: test -f dist/notes/index.html && test -f dist/gemini/index.html
      - run: grep -q 'hunghvt-notes.vercel.app' dist/notes/index.html && grep -q 'home-gemini' dist/index.html

