name: Notes Apps Script prototype
on:
  pull_request:
    branches: [main]
    paths: ['experiments/notes-gas/**', '.github/workflows/notes-gas-prototype.yml', 'docs/NOTES-GAS-*']
  push:
    branches: [prototype/notes-apps-script-drive-20261016]
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test experiments/notes-gas/test/*.test.mjs
      - run: find experiments/notes-gas -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
# Simulation needs no secrets. Optional operational probe below is read-only; no deployment or migration.
  operational-probe:
    if: always() && github.event_name == 'push' && needs.simulation.result == 'success'
    needs: [simulation, source-update]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only Google health and diagnostic metadata (skip when unconfigured)
        env:
          NOTES_GAS_URL: 'https://script.google.com/macros/s/AKfycbwnIO4-cED9dRdNH0ik4FR9os_9kM4XDXqaNdn0iorb5JoiNRIg8dgp0fWEJYurLWAwPA/exec'
          NOTES_GAS_HMAC_KEY: ${{ secrets.NOTES_GAS_HMAC_KEY }}
        run: node experiments/notes-gas/scripts/operations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-prototype-operational-metadata
          path: experiments/notes-gas/ops-result.local.json
          if-no-files-found: ignore
          retention-days: 7
# Probe only runs on the authorized prototype branch push, never on fork pull_request.

  source-update:
    if: github.event_name == 'push' && vars.NOTES_GAS_AUTODEPLOY != 'false'
    needs: simulation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: notes-google-prototype-source
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update only pinned Google prototype after tests
        env:
          NOTES_GAS_AUTODEPLOY: 'true'
          NOTES_GAS_BOOTSTRAP: 'true'
          NOTES_GAS_SCRIPT_ID: '1vASoUHTYVL1pP4oeAbrh0ueOCdo5cWwpUiwUkTleziWgKRod17Pa68cs'
          NOTES_GAS_DEPLOYMENT_ID: 'AKfycbwnIO4-cED9dRdNH0ik4FR9os_9kM4XDXqaNdn0iorb5JoiNRIg8dgp0fWEJYurLWAwPA'
          GAS_OAUTH_CLIENT_ID: ${{ secrets.GAS_OAUTH_CLIENT_ID }}
          GAS_OAUTH_CLIENT_SECRET: ${{ secrets.GAS_OAUTH_CLIENT_SECRET }}
          GAS_OAUTH_REFRESH_TOKEN: ${{ secrets.GAS_OAUTH_REFRESH_TOKEN }}
          NOTES_GAS_URL: 'https://script.google.com/macros/s/AKfycbwnIO4-cED9dRdNH0ik4FR9os_9kM4XDXqaNdn0iorb5JoiNRIg8dgp0fWEJYurLWAwPA/exec'
          NOTES_GAS_HMAC_KEY: ${{ secrets.NOTES_GAS_HMAC_KEY }}
        run: node experiments/notes-gas/scripts/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-prototype-deployment-metadata
          path: experiments/notes-gas/deployment-result.local.json
          if-no-files-found: ignore
          retention-days: 7

  live-benchmark:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-benchmark]')
    needs: [simulation, source-update]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: notes-google-prototype-source
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Synthetic data only, refuse previously used store
        env:
          NOTES_GAS_TEST_ONLY: SYNTHETIC_EMPTY_PROJECT
          NOTES_GAS_URL: 'https://script.google.com/macros/s/AKfycbwnIO4-cED9dRdNH0ik4FR9os_9kM4XDXqaNdn0iorb5JoiNRIg8dgp0fWEJYurLWAwPA/exec'
          NOTES_GAS_HMAC_KEY: ${{ secrets.NOTES_GAS_HMAC_KEY }}
        run: node experiments/notes-gas/scripts/benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-prototype-live-benchmark
          path: experiments/notes-gas/benchmark-result.local.json
          if-no-files-found: ignore
          retention-days: 7

  stage-profile:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[stage-profile]')
    needs: [simulation, source-update]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: notes-google-prototype-source
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Profile retained synthetic store without resetting it
        env:
          NOTES_GAS_PROFILE_ONLY: RETAINED_SYNTHETIC_PROJECT
          NOTES_GAS_URL: 'https://script.google.com/macros/s/AKfycbwnIO4-cED9dRdNH0ik4FR9os_9kM4XDXqaNdn0iorb5JoiNRIg8dgp0fWEJYurLWAwPA/exec'
          NOTES_GAS_HMAC_KEY: ${{ secrets.NOTES_GAS_HMAC_KEY }}
        run: node experiments/notes-gas/scripts/profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-prototype-stage-profile
          path: experiments/notes-gas/profile-result.local.json
          if-no-files-found: ignore
          retention-days: 7

  final-gas-trial:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[final-gas-trial]')
    needs: [simulation, source-update]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: notes-google-prototype-source
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Last GAS-only synthetic cache/pool trial, refuse unexpected state
        env:
          NOTES_GAS_FINAL_TRIAL: SYNTHETIC_CACHE_POOL_ONLY
          NOTES_GAS_URL: 'https://script.google.com/macros/s/AKfycbwnIO4-cED9dRdNH0ik4FR9os_9kM4XDXqaNdn0iorb5JoiNRIg8dgp0fWEJYurLWAwPA/exec'
          NOTES_GAS_HMAC_KEY: ${{ secrets.NOTES_GAS_HMAC_KEY }}
        run: node experiments/notes-gas/scripts/final-trial.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-prototype-final-gas-trial
          path: experiments/notes-gas/final-trial-result.local.json
          if-no-files-found: ignore
          retention-days: 7

  final-integrity:
    if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-final-gas]') && needs.simulation.result == 'success'
    needs: [simulation, source-update]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only integrity of exactly 100 retained synthetic Notes
        env:
          NOTES_GAS_URL: 'https://script.google.com/macros/s/AKfycbwnIO4-cED9dRdNH0ik4FR9os_9kM4XDXqaNdn0iorb5JoiNRIg8dgp0fWEJYurLWAwPA/exec'
          NOTES_GAS_HMAC_KEY: ${{ secrets.NOTES_GAS_HMAC_KEY }}
        run: node experiments/notes-gas/scripts/verify-final.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-prototype-final-integrity
          path: experiments/notes-gas/final-integrity-result.local.json
          if-no-files-found: ignore
          retention-days: 7

  per-note-trial:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[per-note-trial]') || contains(github.event.head_commit.message, '[per-note-resume]'))
    needs: [simulation, source-update, operational-probe]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: notes-google-prototype-source
      cancel-in-progress: false
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Isolated per-note functional and latency trial; never reset old namespace
        env:
          NOTES_GAS_PER_NOTE_TRIAL: ISOLATED_SYNTHETIC_ONLY
          NOTES_GAS_PER_NOTE_RESUME: ${{ contains(github.event.head_commit.message, '[per-note-resume]') && 'EXACT_TWO_NOTE_RECONCILIATION' || '' }}
          NOTES_GAS_URL: 'https://script.google.com/macros/s/AKfycbwnIO4-cED9dRdNH0ik4FR9os_9kM4XDXqaNdn0iorb5JoiNRIg8dgp0fWEJYurLWAwPA/exec'
          NOTES_GAS_HMAC_KEY: ${{ secrets.NOTES_GAS_HMAC_KEY }}
        run: node experiments/notes-gas/scripts/per-note-trial.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-prototype-per-note-trial
          path: experiments/notes-gas/per-note-result.local.json
          if-no-files-found: ignore
          retention-days: 7

  per-note-integrity:
    if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-per-note]') && needs.simulation.result == 'success'
    needs: [simulation, source-update, operational-probe]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only reconciliation; no mutation workload rerun
        env:
          NOTES_GAS_URL: 'https://script.google.com/macros/s/AKfycbwnIO4-cED9dRdNH0ik4FR9os_9kM4XDXqaNdn0iorb5JoiNRIg8dgp0fWEJYurLWAwPA/exec'
          NOTES_GAS_HMAC_KEY: ${{ secrets.NOTES_GAS_HMAC_KEY }}
        run: node experiments/notes-gas/scripts/verify-per-note.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-prototype-per-note-integrity
          path: experiments/notes-gas/per-note-integrity.local.json
          if-no-files-found: ignore
          retention-days: 7
